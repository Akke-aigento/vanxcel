         lovable.app) wijst hij naar vanxcel.be. useDocumentTitle houdt hem daarna bij. -->

    <script>
      (function () {
        var h = location.hostname, l = document.querySelector('link[rel="canonical"]');
        var site = /(^|\.)vanxcel\.(be|nl|com)$/.test(h) ? "https://" + h.replace(/^www\./, "") : "https://vanxcel.be";
        if (l) l.href = site + location.pathname;
      })();
    </script>
